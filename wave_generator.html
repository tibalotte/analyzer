<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wave Generator</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --bg-color: #166985;
            --border-color: #0b2730;
            --card-bg: #f8f8f8;
            --text-light: #ffffff;
            --text-dark: #333333;
        }
        body {
            background-color: #0a151a;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            color: var(--text-dark);
            touch-action: pan-y;
        }
        .app-container {
            background: var(--bg-color);
            border: 3px solid var(--border-color);
            border-radius: 35px;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: var(--text-light);
        }
        h2 { text-align: center; font-weight: bold; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        /* Play / Hold row */
        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .btn-main {
            flex: 1;
            height: 70px;
            border: 2px solid #000;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            color: var(--text-dark);
            transition: background 0.2s;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            gap: 6px;
        }
        .btn-play.active { background: #d4edda; }
        .btn-play.active .icon { color: #dc3545; }
        .btn-hold.active { background: #fff3cd; }

        .card-custom {
            background: var(--card-bg);
            border: 2px solid #000;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            color: var(--text-dark);
        }

        /* Sliders grid */
        .sliders-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 14px;
        }
        .slider-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-wrap.disabled-slider { opacity: 0.38; pointer-events: none; }
        .slider-wrap.knob-sweep-active { opacity: 0.5; pointer-events: none; }
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .slider-label { font-size: 0.78rem; font-weight: bold; color: #444; }
        .slider-val   { font-size: 0.72rem; font-family: monospace; color: #555; }
        /* iOS Safari requires height >= thumb size; track styled via pseudo-element + CSS var */
        .knob-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 24px;
            background: transparent;
            outline: none;
            cursor: pointer;
            padding: 0;
            margin: 0;
            vertical-align: middle;
        }
        .knob-slider::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right,
                var(--thumb-color, #1a7a8a) var(--fill-pct, 0%),
                #e0e0e0 var(--fill-pct, 0%));
        }
        .knob-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px; height: 22px;
            margin-top: -8px;
            border-radius: 50%;
            background: var(--thumb-color, #1a7a8a);
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.35);
            cursor: pointer;
        }
        .knob-slider::-moz-range-track {
            height: 6px; border-radius: 3px; background: #e0e0e0;
        }
        .knob-slider::-moz-range-progress {
            height: 6px; border-radius: 3px;
            background: var(--thumb-color, #1a7a8a);
        }
        .knob-slider::-moz-range-thumb {
            width: 22px; height: 22px; border-radius: 50%;
            background: var(--thumb-color, #1a7a8a);
            border: 2px solid #fff; cursor: pointer;
        }

        /* Sweep Section */
        .sweep-section {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .sweep-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .toggle-ios {
            -webkit-appearance: none;
            appearance: none;
            width: 50px; height: 28px;
            background: #55808f;
            border-radius: 14px;
            position: relative;
            outline: none;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .toggle-ios:checked { background: #2dce6e; }
        .toggle-ios::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 24px; height: 24px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        .toggle-ios:checked::after { transform: translateX(22px); }

        .dual-slider-wrap {
            position: relative;
            height: 40px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 20px;
            margin: 12px 0;
            touch-action: none;
        }
        .ds-track {
            position: absolute;
            top: 17px; left: 12px; right: 12px;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
        }
        .ds-fill {
            position: absolute;
            top: 17px; height: 4px;
            background: #2a6aaa;
            cursor: grab;
            border-radius: 2px;
        }
        .ds-handle {
            position: absolute;
            top: 7px;
            width: 24px; height: 24px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 50%;
            transform: translateX(-50%);
            cursor: ew-resize;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 2;
        }
        .sweep-controls {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        .sweep-toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Horizontal sliders */
        .hs-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 2px;
            margin-top: 10px;
        }
        .hs-val { font-family: monospace; color: #555; font-size: 0.8rem; }
        .horiz-slider-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hs-btn {
            width: 36px; height: 36px;
            flex-shrink: 0;
            background: #eee;
            border: 2px solid #000;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }
        .hs-btn:active { background: #ccc; }
        .hs-range {
            -webkit-appearance: none;
            appearance: none;
            flex-grow: 1;
            height: 24px;
            background: transparent;
            outline: none;
            cursor: pointer;
            padding: 0; margin: 0;
        }
        .hs-range::-webkit-slider-runnable-track {
            height: 6px; border-radius: 3px;
            background: linear-gradient(to right,
                #1a7a8a var(--hs-fill, 50%),
                #ddd var(--hs-fill, 50%));
        }
        .hs-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px; height: 22px;
            margin-top: -8px;
            border-radius: 50%;
            background: #1a7a8a;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .hs-range::-moz-range-track {
            height: 6px; border-radius: 3px; background: #ddd;
        }
        .hs-range::-moz-range-progress {
            height: 6px; border-radius: 3px; background: #1a7a8a;
        }
        .hs-range::-moz-range-thumb {
            width: 22px; height: 22px; border-radius: 50%;
            background: #1a7a8a; border: 2px solid #fff; cursor: pointer;
        }

        /* Visualizers */
        .vis-container {
            display: flex;
            gap: 8px;
            height: 80px;
            margin-bottom: 15px;
        }
        .scope-canvas {
            flex-grow: 1;
            background: #000;
            border: 2px solid #000;
            border-radius: 8px;
            display: block;
        }
        .vu-canvas {
            width: 30px;
            flex-shrink: 0;
            background: #ddd;
            border: 2px solid #000;
            border-radius: 8px;
            display: block;
        }

        /* Presets */
        .presets-section {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .presets-title { font-weight: bold; color: var(--text-light); margin-bottom: 8px; }
        .preset-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .preset-btn {
            padding: 5px 10px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
        }
        .preset-btn:active { background: rgba(255,255,255,0.3); }
        .preset-save-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .preset-name-input {
            flex-grow: 1;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.82rem;
            outline: none;
        }
        .btn-save-preset {
            padding: 5px 12px;
            background: rgba(45,206,110,0.3);
            border: 1px solid #2dce6e;
            border-radius: 8px;
            color: #fff;
            font-size: 0.82rem;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }
        .btn-save-preset:active { background: rgba(45,206,110,0.5); }

        /* Device selector */
        .device-section {
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.85rem;
            margin-top: 15px;
        }
        .device-section label { display: block; margin-bottom: 6px; color: var(--text-light); }
        select {
            width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.9rem;
            background: #fff;
        }
        .ios-msg { margin-top: 6px; font-size: 0.82rem; color: var(--text-light); display: none; }

        .shortcut-hint {
            text-align: center;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.45);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <h2>Wave Generator</h2>

    <div class="btn-row">
        <div class="btn-main btn-play" id="btnPlay">
            <span class="icon">▶</span><span id="playLabel">Play</span>
        </div>
        <div class="btn-main btn-hold" id="btnHold">
            <span>⏸</span><span>Hold</span>
        </div>
    </div>

    <div class="shortcut-hint">Espace = Play/Stop &nbsp;|&nbsp; H = Hold</div>

    <div class="vis-container">
        <canvas class="scope-canvas" id="scopeCanvas"></canvas>
        <canvas class="vu-canvas" id="vuCanvas"></canvas>
    </div>

    <div class="card-custom">
        <div class="sliders-grid" id="knobsGrid"></div>
    </div>

    <div class="sweep-section">
        <div class="sweep-header">
            <span>⟷ Freq Sweep</span>
            <input type="checkbox" class="toggle-ios" id="sweepToggle">
        </div>
        <div id="sweepBody">
            <div style="text-align:center;font-family:monospace;font-size:0.85rem;" id="sweepLabel">50 Hz - 1200 Hz</div>
            <div class="dual-slider-wrap" id="sweepSlider">
                <div class="ds-track"></div>
                <div class="ds-fill" id="sweepFill"></div>
                <div class="ds-handle" id="sweepH1"></div>
                <div class="ds-handle" id="sweepH2"></div>
            </div>
            <div class="sweep-controls">
                <label class="sweep-toggle-label">
                    <input type="checkbox" class="toggle-ios" id="invertToggle">
                    <span>⇄ Inverser</span>
                </label>
                <label class="sweep-toggle-label">
                    <input type="checkbox" class="toggle-ios" id="doubleToggle">
                    <span>⋀ Double</span>
                </label>
            </div>
        </div>
    </div>

    <div class="card-custom">
        <div id="slidersWrap"></div>
    </div>

    <div class="presets-section">
        <div class="presets-title">🎛 Préréglages</div>
        <div class="preset-row" id="builtinPresets"></div>
        <div class="preset-row" id="userPresets"></div>
        <div class="preset-save-row">
            <input type="text" class="preset-name-input" id="presetNameInput" placeholder="Nom du préréglage…">
            <div class="btn-save-preset" id="btnSavePreset">💾 Sauvegarder</div>
        </div>
    </div>

    <div class="device-section">
        <label>Sortie Audio :</label>
        <select id="deviceSelect">
            <option value="">Sélection par défaut</option>
        </select>
        <div class="ios-msg" id="iosDeviceMsg">Le son est dirigé vers le périphérique iOS par défaut.</div>
    </div>
</div>

<script>
// --- MATH UTILS ---
function warpPhase(t, r) {
    const r2 = r*r, r3 = r2*r;
    if (t < r) {
        const a1 = (2*r - 1) / r3;
        const b1 = -3*(2*r - 1) / (2*r2);
        return ((a1*t + b1)*t + 1)*t;
    } else {
        const u = (t - r) / (1 - r);
        return (((1 - 2*r)*u + (6*r - 3)/2)*u + (1 - r))*u + 0.5;
    }
}

function subOctaveHMax(fMain) {
    const cutoff = 200;
    const Sm = 1 / (1 + (fMain/cutoff)**2);
    const Ss = 1 / (1 + ((fMain/2)/cutoff)**2);
    const r = Sm / Ss;
    return r / (1 + r);
}

// --- STATE ---
const STORAGE_KEY = 'stimgen_v10_wave_generator';
const USER_PRESETS_KEY = 'stimgen_v10_user_presets';

const defaultState = {
    freq: 700, volume: 60, rythm: 0.5, depth: 0, emphasis: 0, ratio: 50,
    sweepActive: false, sweepLo: 500, sweepHi: 900, invertSweep: false, doubleSweep: false,
    balance: 0, phase: 0, detuneOffset: 0, detuneDepth: 0, subOctave: 0
};

let state = Object.assign({}, defaultState);

function loadState() {
    try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        Object.assign(state, s);
    } catch(e) {}
    // Sanitize
    state.sweepLo = Math.max(50, Math.min(1190, state.sweepLo || 500));
    state.sweepHi = Math.max(state.sweepLo + 10, Math.min(1200, state.sweepHi || 900));
    // Ensure all keys exist
    Object.keys(defaultState).forEach(k => {
        if (state[k] === undefined) state[k] = defaultState[k];
    });
}

function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

const BUILTIN_PRESETS = [
    { name: 'Défaut',    state: { freq:700,  volume:60, rythm:0.5,  depth:0,  ratio:50, balance:0, phase:0, detuneOffset:0,   detuneDepth:0,  subOctave:0,  sweepActive:false } },
    { name: 'Delta',     state: { freq:200,  volume:60, rythm:2,    depth:80, ratio:50, balance:0, phase:0, detuneOffset:2,   detuneDepth:30, subOctave:0,  sweepActive:false } },
    { name: 'Theta',     state: { freq:432,  volume:60, rythm:6,    depth:70, ratio:50, balance:0, phase:0, detuneOffset:6,   detuneDepth:20, subOctave:0,  sweepActive:false } },
    { name: 'Alpha',     state: { freq:528,  volume:60, rythm:10,   depth:60, ratio:50, balance:0, phase:0, detuneOffset:10,  detuneDepth:20, subOctave:0,  sweepActive:false } },
    { name: 'Sweep ♭',  state: { freq:200,  volume:60, rythm:0.2,  depth:40, ratio:50, balance:0, phase:0, detuneOffset:0,   detuneDepth:0,  subOctave:60, sweepActive:true, sweepLo:80, sweepHi:400 } },
];

function loadUserPresets() {
    try { return JSON.parse(localStorage.getItem(USER_PRESETS_KEY) || '[]'); } catch(e) { return []; }
}
function saveUserPresets(list) { localStorage.setItem(USER_PRESETS_KEY, JSON.stringify(list)); }

function applyPreset(ps) {
    Object.assign(state, ps);
    state.sweepLo = Math.max(50, Math.min(1190, state.sweepLo || 500));
    state.sweepHi = Math.max(state.sweepLo + 10, Math.min(1200, state.sweepHi || 900));
    Object.keys(defaultState).forEach(k => { if (state[k] === undefined) state[k] = defaultState[k]; });
    saveState();
    syncAllUI();
    if (audioInit) { updateModBuffer(); updateAudioParams(); }
}

// --- AUDIO ---
let ctx = null, audioInit = false;
let merger, masterG, analyserL, analyserR, analyserDetune;
let carrierOsc, carrierMix1, carrierOscDetune, carrierMix2, carrierOscH2, harmonicGain;
let balL, balR, amGainL, amGainR, depthGainL, depthGainR, amGainDetune;
let modOsc, delayModL, delayModR, sweepShaper, sweepLFOGain, subSweepGain, detuneConstant;

function initAudio() {
    if (audioInit) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();

    merger = ctx.createChannelMerger(2);
    masterG = ctx.createGain(); masterG.gain.value = 0;
    merger.connect(masterG); masterG.connect(ctx.destination);

    const monL = ctx.createGain(), monR = ctx.createGain();
    masterG.connect(monL); masterG.connect(monR);

    analyserL = ctx.createAnalyser(); analyserL.fftSize = 2048; monL.connect(analyserL);
    analyserR = ctx.createAnalyser(); analyserR.fftSize = 2048; monR.connect(analyserR);
    analyserDetune = ctx.createAnalyser(); analyserDetune.fftSize = 2048;

    carrierOsc = ctx.createOscillator(); carrierMix1 = ctx.createGain();
    carrierOsc.connect(carrierMix1);

    carrierOscDetune = ctx.createOscillator(); carrierMix2 = ctx.createGain();
    carrierOscDetune.connect(carrierMix2);

    carrierOscH2 = ctx.createOscillator(); harmonicGain = ctx.createGain();
    carrierOscH2.connect(harmonicGain);

    const mainSum = ctx.createGain();
    carrierMix1.connect(mainSum); carrierMix2.connect(mainSum); harmonicGain.connect(mainSum);

    amGainL = ctx.createGain(); amGainR = ctx.createGain();
    balL = ctx.createGain(); balR = ctx.createGain();
    mainSum.connect(amGainL); amGainL.connect(balL); balL.connect(merger, 0, 0);
    mainSum.connect(amGainR); amGainR.connect(balR); balR.connect(merger, 0, 1);

    delayModL = ctx.createDelay(5.0); delayModR = ctx.createDelay(5.0);
    depthGainL = ctx.createGain(); depthGainR = ctx.createGain();
    delayModL.connect(depthGainL); delayModR.connect(depthGainR);
    depthGainL.connect(amGainL.gain); depthGainR.connect(amGainR.gain);

    amGainDetune = ctx.createGain(); amGainDetune.gain.value = 0;
    carrierMix2.connect(amGainDetune); amGainDetune.connect(analyserDetune);
    depthGainL.connect(amGainDetune.gain);

    sweepShaper = ctx.createWaveShaper();
    sweepLFOGain = ctx.createGain();
    subSweepGain = ctx.createGain(); subSweepGain.gain.value = 0.5;
    sweepShaper.connect(sweepLFOGain);
    sweepLFOGain.connect(carrierOsc.frequency);
    sweepLFOGain.connect(carrierOscDetune.frequency);
    sweepLFOGain.connect(subSweepGain); subSweepGain.connect(carrierOscH2.frequency);

    detuneConstant = ctx.createConstantSource();
    detuneConstant.connect(carrierOscDetune.frequency);

    carrierOsc.start(); carrierOscDetune.start(); carrierOscH2.start(); detuneConstant.start();

    updateModBuffer();
    updateAudioParams();
    audioInit = true;
}

let currentPhaseIntegrator = 0;
function updateModBuffer() {
    if (!ctx) return;
    const size = ctx.sampleRate;
    const buf = ctx.createBuffer(1, size, ctx.sampleRate);
    const data = buf.getChannelData(0);
    const ratio = state.ratio / 100;
    for (let i = 0; i < size; i++) data[i] = Math.sin(2 * Math.PI * warpPhase(i/size, ratio));

    const newOsc = ctx.createBufferSource();
    newOsc.buffer = buf; newOsc.loop = true;
    newOsc.playbackRate.value = state.hold ? 0 : state.rythm;
    newOsc.connect(sweepShaper); newOsc.connect(delayModL); newOsc.connect(delayModR);

    const now = ctx.currentTime;
    newOsc.start(now, (currentPhaseIntegrator % 1.0) * buf.duration);
    if (modOsc) { modOsc.stop(now); try { modOsc.disconnect(); } catch(e) {} }
    modOsc = newOsc;
}

function updateAudioParams() {
    if (!ctx) return;
    const now = ctx.currentTime;

    masterG.gain.setTargetAtTime(state.playing ? state.volume / 100 : 0, now, 0.05);
    if (modOsc) modOsc.playbackRate.setTargetAtTime(state.hold ? 0 : state.rythm, now, 0.05);

    const cf = state.sweepActive ? (state.sweepLo + state.sweepHi)/2 : state.freq;
    carrierOsc.frequency.setTargetAtTime(cf, now, 0.05);
    carrierOscH2.frequency.setTargetAtTime(cf/2, now, 0.05);
    carrierOscDetune.frequency.setTargetAtTime(cf, now, 0.05);
    detuneConstant.offset.setTargetAtTime(state.detuneOffset, now, 0.05);

    const hRaw = state.subOctave / 100;
    const h = cf < 100 ? 0 : hRaw * subOctaveHMax(cf);
    const d = state.detuneDepth / 100;
    carrierMix1.gain.setTargetAtTime((1-h)*(1-d/2), now, 0.05);
    carrierMix2.gain.setTargetAtTime((1-h)*(d/2), now, 0.05);
    harmonicGain.gain.setTargetAtTime(h, now, 0.05);

    const depth = state.depth / 100;
    const amBase = 1.0 - depth/2;
    amGainL.gain.setTargetAtTime(amBase, now, 0.05);
    amGainR.gain.setTargetAtTime(amBase, now, 0.05);
    amGainDetune.gain.setTargetAtTime(amBase, now, 0.05);
    depthGainL.gain.setTargetAtTime(depth/2, now, 0.05);
    depthGainR.gain.setTargetAtTime(depth/2, now, 0.05);

    balL.gain.setTargetAtTime(state.balance > 0 ? 1 - state.balance/100 : 1, now, 0.05);
    balR.gain.setTargetAtTime(state.balance < 0 ? 1 + state.balance/100 : 1, now, 0.05);

    let delaySecs = state.rythm > 0.01 ? (Math.abs(state.phase)/360) / state.rythm : 0;
    delaySecs = Math.min(delaySecs, 5.0);
    delayModL.delayTime.setTargetAtTime(state.phase < 0 ? delaySecs : 0, now, 0.05);
    delayModR.delayTime.setTargetAtTime(state.phase > 0 ? delaySecs : 0, now, 0.05);

    let sr = state.sweepActive ? (state.sweepHi - state.sweepLo)/2 : 0;
    if (state.invertSweep) sr = -sr;
    sweepLFOGain.gain.setTargetAtTime(sr, now, 0.05);

    if (state.doubleSweep && state.sweepActive) {
        const c = new Float32Array(2048);
        for (let i = 0; i < 2048; i++) c[i] = 2 * Math.abs((i/2047)*2 - 1) - 1;
        sweepShaper.curve = c;
    } else {
        const c = new Float32Array([-1, 1]);
        sweepShaper.curve = c;
    }
}

// --- KNOBS (grid sliders) ---
const knobsDef = [
    { id:'freq',     label:'Fréquence', min:50,  max:1200, step:10,   color:'#1a7a8a', fmt: v => v+' Hz' },
    { id:'volume',   label:'Volume',    min:0,   max:100,  step:1,    color:'#b87830', fmt: v => v+' %' },
    { id:'rythm',    label:'Rythm',     min:0,   max:5,    step:0.05, color:'#2a6aaa', fmt: v => (+v).toFixed(2)+' Hz' },
    { id:'depth',    label:'Depth',     min:0,   max:100,  step:1,    color:'#2a8a5a', fmt: v => v+' %' },
    { id:'emphasis', label:'Emphasis',  min:0,   max:100,  step:1,    color:'#7a4a8a', fmt: v => v+' %', disabled:true },
    { id:'ratio',    label:'Ratio',     min:20,  max:80,   step:1,    color:'#aa5a4a', fmt: v => v+'/'+(100-v) }
];
const knobRefs = {};

function renderKnobs() {
    const grid = document.getElementById('knobsGrid');
    grid.innerHTML = '';
    knobsDef.forEach(k => {
        const wrap = document.createElement('div');
        wrap.className = 'slider-wrap' + (k.disabled ? ' disabled-slider' : '');
        wrap.id = 'wrap_' + k.id;

        const hdr = document.createElement('div');
        hdr.className = 'slider-header';

        const lbl = document.createElement('span');
        lbl.className = 'slider-label';
        lbl.textContent = k.label;

        const valEl = document.createElement('span');
        valEl.className = 'slider-val';
        valEl.id = 'val_' + k.id;

        hdr.appendChild(lbl); hdr.appendChild(valEl);

        const input = document.createElement('input');
        input.type = 'range';
        input.className = 'knob-slider';
        input.min = k.min; input.max = k.max; input.step = k.step;
        const cur = (state[k.id] !== undefined) ? state[k.id] : k.min;
        input.value = cur;
        input.style.setProperty('--thumb-color', k.color);

        const setTrack = (v) => {
            const pct = Math.max(0, Math.min(100, ((v - k.min) / (k.max - k.min)) * 100));
            // Set CSS variable — works on iOS Safari where inline background on the input itself doesn't affect the track
            input.style.setProperty('--fill-pct', pct + '%');
        };
        setTrack(cur);
        valEl.textContent = k.fmt(cur);

        input.addEventListener('input', () => {
            if (k.id === 'freq' && state.sweepActive) return;
            const v = Math.round(parseFloat(input.value) / k.step) * k.step;
            state[k.id] = v;
            setTrack(v); valEl.textContent = k.fmt(v);
            if (k.id === 'ratio') updateModBuffer();
            if (audioInit) updateAudioParams();
            saveState(); updateHSDisplays();
        });

        wrap.appendChild(hdr); wrap.appendChild(input);
        grid.appendChild(wrap);
        knobRefs[k.id] = { input, valEl, def: k, setTrack };
    });
}

function syncKnob(id, overrideVal) {
    const r = knobRefs[id];
    if (!r) return;
    const v = overrideVal !== undefined ? overrideVal : state[id];
    r.valEl.textContent = r.def.fmt(v);
    r.input.value = v;
    r.setTrack(v);
}

// --- HORIZONTAL SLIDERS ---
const hsDef = [
    { id:'balance',      label:'Balance',            min:-100, max:100,  step:1   },
    { id:'phase',        label:'Déphasage L/R',      min:-45,  max:45,   step:1   },
    { id:'detuneOffset', label:'Détune Offset',      min:-2.5, max:2.5,  step:0.1 },
    { id:'detuneDepth',  label:'Profondeur Détune',  min:0,    max:100,  step:1   },
    { id:'subOctave',    label:'Sous-octave (Bass)', min:0,    max:100,  step:1   }
];
const hsRefs = {};

function fmtHS(id, v) {
    v = +v;
    if (id === 'balance')      return v === 0 ? 'Centre' : (v < 0 ? `◀ L ${-v}` : `R ${v} ▶`);
    if (id === 'phase')        return v === 0 ? 'Synchro' : (v > 0 ? `L mène ${v}°` : `R mène ${-v}°`);
    if (id === 'detuneOffset') return v === 0 ? 'Synchro' : `${v>0?'+':''}${v.toFixed(1)} Hz`;
    if (id === 'detuneDepth')  return v + ' %';
    if (id === 'subOctave') {
        const cf = state.sweepActive ? (state.sweepLo+state.sweepHi)/2 : state.freq;
        return cf < 100 ? '(muet)' : `${v} % (${(cf/2).toFixed(0)} Hz)`;
    }
    return v;
}

function holdRepeat(el, fn) {
    let timer = null;
    const go = (e) => { e.preventDefault(); fn(); timer = setTimeout(function tick(){ fn(); timer = setTimeout(tick, 80); }, 400); };
    const stop = () => { clearTimeout(timer); timer = null; };
    el.addEventListener('mousedown', go);
    el.addEventListener('touchstart', go, { passive: false });
    window.addEventListener('mouseup', stop);
    window.addEventListener('touchend', stop);
}

function renderSliders() {
    const wrap = document.getElementById('slidersWrap');
    wrap.innerHTML = '';
    hsDef.forEach(s => {
        const row = document.createElement('div');

        const lblRow = document.createElement('div');
        lblRow.className = 'hs-label-row';
        const lbl = document.createElement('span'); lbl.textContent = s.label;
        const valEl = document.createElement('span'); valEl.className = 'hs-val'; valEl.id = 'hsval_' + s.id;
        lblRow.appendChild(lbl); lblRow.appendChild(valEl);

        const cw = document.createElement('div'); cw.className = 'horiz-slider-wrap';
        const btnM = document.createElement('div'); btnM.className = 'hs-btn'; btnM.textContent = '−';
        const btnP = document.createElement('div'); btnP.className = 'hs-btn'; btnP.textContent = '+';
        const range = document.createElement('input'); range.type = 'range';
        range.className = 'hs-range';
        range.min = s.min; range.max = s.max; range.step = s.step;
        const cur = (state[s.id] !== undefined) ? state[s.id] : 0;
        range.value = cur;
        valEl.textContent = fmtHS(s.id, cur);

        const setHSTrack = (v) => {
            const pct = Math.max(0, Math.min(100, ((v - s.min) / (s.max - s.min)) * 100));
            range.style.setProperty('--hs-fill', pct + '%');
        };
        setHSTrack(cur);

        cw.appendChild(btnM); cw.appendChild(range); cw.appendChild(btnP);
        row.appendChild(lblRow); row.appendChild(cw);
        wrap.appendChild(row);

        const update = (nv) => {
            nv = Math.round(Math.max(s.min, Math.min(s.max, nv)) / s.step) * s.step;
            state[s.id] = nv;
            range.value = nv;
            valEl.textContent = fmtHS(s.id, nv);
            setHSTrack(nv);
            if (audioInit) updateAudioParams();
            saveState();
        };
        range.addEventListener('input', e => update(parseFloat(e.target.value)));
        holdRepeat(btnM, () => update(state[s.id] - s.step));
        holdRepeat(btnP, () => update(state[s.id] + s.step));

        hsRefs[s.id] = { range, valEl };
    });
}

function updateHSDisplays() {
    hsDef.forEach(s => {
        const el = document.getElementById('hsval_' + s.id);
        if (el) el.textContent = fmtHS(s.id, state[s.id]);
    });
}

function syncAllUI() {
    renderKnobs();
    renderSliders();
    updateSweepUI();
    document.getElementById('invertToggle').checked = !!state.invertSweep;
    document.getElementById('doubleToggle').checked = !!state.doubleSweep;
}

// --- SWEEP ---
const sWrap = document.getElementById('sweepSlider');
const sFill = document.getElementById('sweepFill');
const sH1   = document.getElementById('sweepH1');
const sH2   = document.getElementById('sweepH2');
const sBody = document.getElementById('sweepBody');

function updateSweepUI() {
    const minF = 50, maxF = 1200;
    const w = sWrap.offsetWidth - 24;
    const p1 = (state.sweepLo - minF) / (maxF - minF);
    const p2 = (state.sweepHi - minF) / (maxF - minF);
    sH1.style.left = `calc(12px + ${p1*w}px)`;
    sH2.style.left = `calc(12px + ${p2*w}px)`;
    sFill.style.left = `calc(12px + ${p1*w}px)`;
    sFill.style.width = `${(p2-p1)*w}px`;
    document.getElementById('sweepLabel').textContent = `${state.sweepLo} Hz — ${state.sweepHi} Hz`;
    sBody.style.opacity = state.sweepActive ? '1' : '0.5';
    sBody.style.pointerEvents = state.sweepActive ? 'auto' : 'none';
    document.getElementById('sweepToggle').checked = state.sweepActive;
    const fw = document.getElementById('wrap_freq');
    if (fw) {
        fw.classList.toggle('knob-sweep-active', state.sweepActive);
        if (!state.sweepActive) syncKnob('freq');
    }
}

function bindSweep() {
    let drag = null, sx, sLo, sHi;
    const onStart = (type, e) => {
        drag = type; sx = e.touches ? e.touches[0].clientX : e.clientX;
        sLo = state.sweepLo; sHi = state.sweepHi;
        e.preventDefault();
    };
    const onMove = (e) => {
        if (!drag) return;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const w = sWrap.offsetWidth - 24;
        const df = Math.round(((x - sx) / w) * 1150 / 10) * 10;
        if (drag === 'h1')   state.sweepLo = Math.max(50, Math.min(state.sweepHi-10, sLo+df));
        else if (drag === 'h2') state.sweepHi = Math.max(state.sweepLo+10, Math.min(1200, sHi+df));
        else if (drag === 'fill') {
            const span = sHi - sLo;
            let lo = sLo+df, hi = sHi+df;
            if (lo < 50) { lo=50; hi=lo+span; }
            if (hi > 1200) { hi=1200; lo=hi-span; }
            state.sweepLo=lo; state.sweepHi=hi;
        }
        updateSweepUI(); if (audioInit) updateAudioParams(); updateHSDisplays();
    };
    const onEnd = () => { if (drag) { drag=null; saveState(); } };

    ['mousedown','touchstart'].forEach(ev => {
        const opts = ev === 'touchstart' ? {passive:false} : {};
        sH1.addEventListener(ev, e => onStart('h1',e), opts);
        sH2.addEventListener(ev, e => onStart('h2',e), opts);
        sFill.addEventListener(ev, e => onStart('fill',e), opts);
    });
    window.addEventListener('mousemove', onMove, {passive:false});
    window.addEventListener('touchmove', onMove, {passive:false});
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchend', onEnd);

    document.getElementById('sweepToggle').addEventListener('change', e => {
        state.sweepActive = e.target.checked;
        updateSweepUI(); if (audioInit) updateAudioParams(); updateHSDisplays(); saveState();
    });
    document.getElementById('invertToggle').addEventListener('change', e => {
        state.invertSweep = e.target.checked; if (audioInit) updateAudioParams(); saveState();
    });
    document.getElementById('doubleToggle').addEventListener('change', e => {
        state.doubleSweep = e.target.checked; if (audioInit) updateAudioParams(); saveState();
    });
}

// --- PRESETS ---
function renderPresets() {
    const bi = document.getElementById('builtinPresets');
    bi.innerHTML = '';
    BUILTIN_PRESETS.forEach(p => {
        const b = document.createElement('div'); b.className = 'preset-btn'; b.textContent = p.name;
        b.addEventListener('click', () => applyPreset(p.state));
        bi.appendChild(b);
    });
    renderUserPresets();
}

function renderUserPresets() {
    const row = document.getElementById('userPresets');
    row.innerHTML = '';
    loadUserPresets().forEach((p, i) => {
        const b = document.createElement('div'); b.className = 'preset-btn';
        b.innerHTML = `${p.name} <span style="opacity:0.6;font-size:0.7em" data-idx="${i}">✕</span>`;
        b.addEventListener('click', e => {
            if (e.target.dataset.idx !== undefined) {
                const list = loadUserPresets(); list.splice(+e.target.dataset.idx, 1);
                saveUserPresets(list); renderUserPresets();
            } else { applyPreset(p.state); }
        });
        row.appendChild(b);
    });
}

document.getElementById('btnSavePreset').addEventListener('click', () => {
    const name = document.getElementById('presetNameInput').value.trim();
    if (!name) return;
    const list = loadUserPresets();
    const ps = Object.assign({}, state);
    list.push({ name, state: ps });
    saveUserPresets(list);
    document.getElementById('presetNameInput').value = '';
    renderUserPresets();
});

// --- VISUALIZERS ---
const scopeCanvas = document.getElementById('scopeCanvas');
const vuCanvas    = document.getElementById('vuCanvas');
const sCtx = scopeCanvas.getContext('2d');
const vCtx = vuCanvas.getContext('2d');
const bufL = new Float32Array(2048), bufR = new Float32Array(2048), bufD = new Float32Array(2048);
let dpr = 1;

function initCanvas() {
    dpr = window.devicePixelRatio || 1;
    const w1 = scopeCanvas.offsetWidth || 280;
    const w2 = vuCanvas.offsetWidth || 30;
    scopeCanvas.width = w1 * dpr; scopeCanvas.height = 80 * dpr;
    vuCanvas.width = w2 * dpr;   vuCanvas.height = 80 * dpr;
    sCtx.scale(dpr, dpr); vCtx.scale(dpr, dpr);
}

function drawScope() {
    const w = scopeCanvas.offsetWidth || 280, h = 80;
    sCtx.fillStyle = '#0a151a';
    sCtx.fillRect(0, 0, w, h);
    sCtx.strokeStyle = 'rgba(255,255,255,0.08)';
    sCtx.lineWidth = 1;
    sCtx.beginPath();
    for (let x = 0; x < w; x += 28) { sCtx.moveTo(x,0); sCtx.lineTo(x,h); }
    for (let y = 0; y < h; y += 28) { sCtx.moveTo(0,y); sCtx.lineTo(w,y); }
    sCtx.stroke();

    if (!ctx || !state.playing) return;
    analyserL.getFloatTimeDomainData(bufL);
    analyserR.getFloatTimeDomainData(bufR);

    const trace = (buf, color, lw) => {
        sCtx.beginPath(); sCtx.strokeStyle = color; sCtx.lineWidth = lw;
        for (let i = 0; i < buf.length; i += 4) {
            const x = (i/buf.length)*w, y = (0.5 - buf[i]*0.5)*h;
            i === 0 ? sCtx.moveTo(x,y) : sCtx.lineTo(x,y);
        }
        sCtx.stroke();
    };

    if (state.detuneDepth > 0) {
        analyserDetune.getFloatTimeDomainData(bufD);
        const cf2 = state.sweepActive ? (state.sweepLo+state.sweepHi)/2 : state.freq;
        const h2 = cf2 < 100 ? 0 : (state.subOctave/100) * subOctaveHMax(cf2);
        const sc = (1-h2)*(state.detuneDepth/100/2)*(state.volume/100);
        for (let i = 0; i < bufD.length; i++) bufD[i] *= sc;
        trace(bufD, 'rgba(217,127,42,0.7)', 1.5);
    }
    trace(bufL, '#2a6aaa', 2);
    trace(bufR, '#dc3545', 2);

    let pkL = 0, pkR = 0;
    for (let i = 0; i < bufL.length; i++) {
        if (Math.abs(bufL[i]) > pkL) pkL = Math.abs(bufL[i]);
        if (Math.abs(bufR[i]) > pkR) pkR = Math.abs(bufR[i]);
    }
    const vw = vuCanvas.offsetWidth || 30;
    vCtx.clearRect(0,0,vw,h);
    vCtx.fillStyle = '#2a6aaa'; vCtx.fillRect(2, h-pkL*h, vw/2-3, pkL*h);
    vCtx.fillStyle = '#dc3545'; vCtx.fillRect(vw/2+1, h-pkR*h, vw/2-3, pkR*h);
}

let lastTime = performance.now();
function animate() {
    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (state.playing && !state.hold) {
        currentPhaseIntegrator = (currentPhaseIntegrator + dt * state.rythm) % 1.0;
    }

    if (state.sweepActive && state.playing && !state.hold) {
        let lfo = Math.sin(2*Math.PI*warpPhase(currentPhaseIntegrator, state.ratio/100));
        if (state.doubleSweep) lfo = 2*Math.abs(lfo)-1;
        if (state.invertSweep) lfo = -lfo;
        const instFreq = (state.sweepLo+state.sweepHi)/2 + (state.sweepHi-state.sweepLo)/2*lfo;
        const r = knobRefs['freq'];
        if (r) r.valEl.textContent = r.def.fmt(Math.round(instFreq));
    }

    drawScope();
    requestAnimationFrame(animate);
}

// --- PLAY / HOLD ---
document.getElementById('btnPlay').addEventListener('click', () => {
    if (!audioInit) initAudio();
    if (ctx.state === 'suspended') ctx.resume().then(togglePlay);
    else togglePlay();
});

function togglePlay() {
    state.playing = !state.playing;
    const btn = document.getElementById('btnPlay');
    if (state.playing) {
        btn.classList.add('active');
        btn.innerHTML = '<span class="icon">■</span><span>Stop</span>';
    } else {
        btn.classList.remove('active');
        btn.innerHTML = '<span class="icon">▶</span><span>Play</span>';
    }
    if (audioInit) updateAudioParams();
}

document.getElementById('btnHold').addEventListener('click', () => {
    state.hold = !state.hold;
    document.getElementById('btnHold').classList.toggle('active', state.hold);
    if (audioInit) updateAudioParams();
});

document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
    if (e.code === 'Space') { e.preventDefault(); document.getElementById('btnPlay').click(); }
    else if (e.key === 'h' || e.key === 'H') document.getElementById('btnHold').click();
});

// --- DEVICE SELECTOR ---
function setupDevices() {
    const sel = document.getElementById('deviceSelect');
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS) {
        sel.style.display = 'none';
        document.getElementById('iosDeviceMsg').style.display = 'block';
    } else {
        navigator.mediaDevices && navigator.mediaDevices.getUserMedia({ audio: true }).then(() => {
            navigator.mediaDevices.enumerateDevices().then(devices => {
                devices.filter(d => d.kind === 'audiooutput').forEach((d, i) => {
                    const o = document.createElement('option');
                    o.value = d.deviceId; o.text = d.label || `Speaker ${i+1}`;
                    sel.appendChild(o);
                });
            });
        }).catch(() => {});
        sel.addEventListener('change', e => {
            if (ctx && typeof ctx.setSinkId === 'function') ctx.setSinkId(e.target.value).catch(console.error);
        });
    }
}

// --- BOOT ---
window.addEventListener('load', () => {
    loadState();
    renderKnobs();
    renderSliders();
    bindSweep();
    renderPresets();

    document.getElementById('invertToggle').checked = !!state.invertSweep;
    document.getElementById('doubleToggle').checked = !!state.doubleSweep;
    setupDevices();

    // Wait until the sweep slider has a real width before positioning handles
    // (iOS may need a few frames after load to complete layout)
    function waitForLayout(attempts) {
        initCanvas();
        updateSweepUI();
        if (sWrap.offsetWidth < 10 && attempts > 0) {
            setTimeout(() => waitForLayout(attempts - 1), 50);
        }
    }
    requestAnimationFrame(() => waitForLayout(10));
    requestAnimationFrame(animate);
});
</script>
